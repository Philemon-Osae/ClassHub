<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rep Timetable</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0a0a0f] text-white p-6"><div class="max-w-3xl mx-auto">
<a href="/" class="text-xs bg-gray-800 px-3 py-1 rounded-full">← Dashboard</a>
<h1 class="text-2xl font-bold mt-4">Manage Timetable</h1>
{% with messages = get_flashed_messages() %}{% if messages %}<div class="bg-green-900/30 border border-green-800 p-2 rounded mb-3 text-xs">{{ messages[0] }}</div>{% endif %}{% endwith %}
{% for t in timetables %}<div class="bg-[#1a1a23] p-4 rounded-xl border border-gray-800 flex justify-between mt-2"><div><p class="font-bold text-sm">{{ t.week_label }}</p><p class="text-[10px] text-gray-500">{{ t.created_at }}</p>{% if t.image_url %}<a href="{{ t.image_url }}" target="_blank" class="text-xs text-blue-400">View Image</a>{% endif %}</div><form method="POST"><input type="hidden" name="id" value="{{ t.id }}"><input type="hidden" name="action" value="delete"><button class="bg-red-600 px-3 py-1 rounded-full text-xs">DELETE</button></form></div>{% else %}<p class="text-xs text-gray-500 mt-2">No timetables</p>{% endfor %}
<form method="POST" enctype="multipart/form-data" class="bg-[#1a1a23] p-5 rounded-2xl border border-indigo-900 space-y-3 mt-6">
<input type="hidden" name="action" value="upload">
<input name="week_label" placeholder="Week 2 Updated 26-30 Oct" class="w-full bg-black border border-gray-700 rounded-xl p-3 text-sm" required>
<textarea name="json_data" placeholder='Optional JSON {"MON":[{"time":"9-11","course":"CICS 111"}]}' class="w-full bg-black border border-gray-700 rounded-xl p-3 text-sm h-24"></textarea>
<input type="file" name="timetable_image" accept="image/*" class="w-full bg-black border border-gray-700 rounded-xl p-3 text-sm">
<button class="w-full bg-green-600 p-3 rounded-xl font-bold">Upload for all</button>
</form>
</div></body></html>
